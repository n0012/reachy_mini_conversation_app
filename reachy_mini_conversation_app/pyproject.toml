[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name MUST match the reachy_mini_apps entry-point name below
# so the launcher's `pip uninstall <app-name>` succeeds. Otherwise the
# launcher reports "Successfully uninstalled" but the package stays.
name = "reachy_mini_gemini_live"
version = "0.6.0"
authors = [{ name = "Nick Losier" }]
maintainers = [{ name = "Nick Losier" }]
description = "Reachy Mini conversation app — Gemini Live edition: per-user memory, MCP tools, Home Assistant control, offline wake word. Fork of pollen-robotics/reachy_mini_conversation_app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    #Media
    # No gradio/fastrtc: fastrtc needs gradio<6, gradio 5.x caps pydantic<=2.12.3, and
    # reachy-mini>=1.12 needs pydantic>=2.12.5. Headless audio uses streaming.py instead.
    "av",
    "huggingface-hub>=1.20.1,<2",

    #Environment variables
    "python-dotenv",

    #Gemini
    "google-genai>=2.33.0",

    #Wake word (Edge Impulse — luisomoreau/hey_reachy_wake_word_detection)
    # NOTE: edge-impulse-linux imports pyaudio at module top, so PyAudio
    # is required even though we use sounddevice for actual capture.
    # System dep on Linux: portaudio19-dev (factory-installed on Reachy Mini OS).
    "edge-impulse-linux>=1.0.7",
    "PyAudio>=0.2.14",
    "sounddevice>=0.5.0",
    "scipy>=1.10",
    "opencv-python-headless>=4.5.1.48,<5",  # required by edge_impulse_linux.__init__

    #Auth (no gcloud CLI needed on robot)
    "google-auth>=2.0.0",

    #Memory + MCP (Phase 4 & 5)
    "aiosqlite>=0.21",
    "mcp>=1.0.0,<2",  # client uses streamablehttp_client, removed in mcp 2.x

    #Reachy mini
    "reachy_mini_dances_library",
    "reachy_mini_toolbox",
    "reachy-mini>=1.12.0",
]

[project.optional-dependencies]
local_vision = [
  "accelerate>=1.13.0",
  "pillow",
  "torch>=2.1",
  "transformers==5.3.0",
  "num2words",
]
yolo_vision = [
  "ultralytics",
  "supervision",
  "opencv-python>=4.13.0.92",
]
mediapipe_vision = [
  "mediapipe==0.10.14",
]
all_vision = [
  "accelerate>=1.13.0",
  "pillow",
  "torch>=2.1",
  "transformers==5.3.0",
  "num2words",
  "ultralytics",
  "supervision",
  "opencv-python>=4.13.0.92",
  "mediapipe==0.10.14",
]

[dependency-groups]
dev = [
  "pillow",
  "pytest",
  "pytest-asyncio",
  "ruff==0.12.0",
  "mypy==1.18.2",
  "pre-commit",
  "types-requests",
  "python-semantic-release>=10.5.3",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/n0012/reachy_mini_conversation_app_gemini"
Source = "https://github.com/n0012/reachy_mini_conversation_app"
Author = "https://www.linkedin.com/in/nicklosier"
Upstream = "https://huggingface.co/spaces/pollen-robotics/reachy_mini_conversation_app"

[project.scripts]
reachy-mini-gemini-live = "reachy_mini_gemini_live.main:main"

[tool.uv]
dependency-metadata = [
    # Upstream metadata currently marks `gstreamer-msvc-runtime` as unconditional.
    # It should only be required on Windows. Temp fix.
    { name = "gstreamer-libs", version = "1.28.3", requires-dist = ["gstreamer-msvc-runtime; sys_platform == 'win32'", "setuptools"] },
    # sdist-only; declaring metadata lets `uv lock` run on machines without cairo/pkg-config.
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.2", requires-dist = [] },
]
# reachy-mini pins gstreamer-bundle==1.28.3 (non-Linux) but the bundle leaves its parts unpinned;
# 1.28.8 shipped without macOS wheels. Keep the parts on the bundle version.
constraint-dependencies = [
    "gstreamer-cli==1.28.3",
    "gstreamer-gtk==1.28.3",
    "gstreamer-libs==1.28.3",
    "gstreamer-plugins==1.28.3",
    "gstreamer-plugins-gpl==1.28.3",
    "gstreamer-plugins-gpl-restricted==1.28.3",
    "gstreamer-plugins-restricted==1.28.3",
    "gstreamer-python==1.28.3",
    "gstreamer-plugins-libs==1.28.3",
    "gstreamer-ext-runtime==1.28.3",
]

[project.entry-points."reachy_mini_apps"]
reachy_mini_gemini_live = "reachy_mini_gemini_live.main:ReachyMiniConversationApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reachy_mini_gemini_live = [
  "images/*",
  "static/*",
  "models/*.onnx",
  "models/*.eim",
  "sounds/*.wav",
  ".env.example",
  "demos/**/*.txt",
  "prompts_library/*.txt",
  "prompts/**/*.txt",
]
reachy_talk_data = [
  "profiles/**/*.txt",
  "profiles/**/*.py",
]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
]
ignore = [
  "E501",  # handled by formatter
  "D100",  # ignore missing module docstrings
  "D203",  # blank line before class docstring (conflicts with D211)
  "D213",  # summary on second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "D107"]  # test names describe themselves

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = ["standard-library", "local-folder"]
known-local-folder = ["reachy_mini_gemini_live"]
known-first-party = ["reachy_mini", "reachy_mini_dances_library", "reachy_mini_toolbox"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src/"]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true
